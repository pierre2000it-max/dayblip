name: Live Site Check

# Crawls every URL in the production sitemap and checks status, title length,
# meta description length, canonical, noindex, and h1. Opens (or updates) a
# GitHub issue when anything fails. See scripts/check-live-site.mjs.

on:
  schedule:
    # Mondays 12:30 UTC = 6:30 AM Central (CST). 7:30 AM during daylight time.
    - cron: '30 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Crawl sitemap and check every page
        id: crawl
        run: |
          set +e
          node scripts/check-live-site.mjs > crawl.txt 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat crawl.txt

      - name: Open or update issue on failure
        if: steps.crawl.outputs.exit != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const report = fs.readFileSync('crawl.txt', 'utf8').trim()
            const title = 'Live site check failed'
            const body = [
              `Weekly crawl of the production sitemap found problems. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Rules checked: HTTP 200, title under 60 chars, meta description 120-155 chars ending in a sentence, canonical matches the sitemap URL, no noindex, h1 present in server HTML.',
              '',
              '```',
              report.slice(0, 60000),
              '```',
            ].join('\n')
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'live-check',
            })
            const existing = open.find((i) => i.title === title)
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['live-check'],
              })
            }

      - name: Fail the job so the run shows red
        if: steps.crawl.outputs.exit != '0'
        run: exit 1
