name: Annual Data Update Reminder

on:
  schedule:
    # Runs at 9:00 AM UTC on January 1st every year
    - cron: '0 9 1 1 *'
  workflow_dispatch:
    # Also allows manual trigger from GitHub Actions tab

jobs:
  create-reminder-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Create Annual Data Update Issue
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().split('T')[0]
            const year = new Date().getFullYear()

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🗓️ Annual Data Update Required — ${year}`,
              labels: ['annual-update', 'data'],
              body: `# Dayblip Annual Data Update Checklist — ${year}

Triggered automatically on January 1st. Complete all items before January 31st.

---

## 🏛️ IRS TAX DATA — Update by January 31st
Source: https://www.irs.gov/newsroom (search "inflation adjustments ${year}")
Revenue Procedure published each October for the following tax year.

### Files to update:

**\`src/app/finance/take-home-pay/page.tsx\`**
- [ ] \`STD_DEDUCTION\` object — single, mfj, mfs, hoh values
- [ ] \`BRACKETS_SINGLE\`, \`BRACKETS_MFJ\`, \`BRACKETS_HOH\` arrays
- [ ] Any year references in FAQ text

**\`src/app/finance/tax-bracket/page.tsx\`**
- [ ] Tax bracket threshold values
- [ ] Standard deduction values
- [ ] Year in page title and meta description (layout.tsx)

**\`src/app/finance/paycheck-calculator/page.tsx\`**
- [ ] \`const ssCap = XXXXXX\` — SS wage base (from SSA, not IRS)
- [ ] Federal bracket arrays
- [ ] FAQ text mentioning year

**\`src/app/embed/(tools)/take-home-pay/page.tsx\`**
- [ ] \`Math.min(s, XXXXXX)\` — SS wage base
- [ ] ⚠️ This file has historically been 2+ years stale — prioritize

**\`src/app/daily/page.tsx\`**
- [ ] 401k contribution limit label (IRS)
- [ ] SS wage base in FICA explanation text (two locations)

**\`src/app/tools/tax-refund-estimator/page.tsx\`**
- [ ] \`STD_DEDUCTION\` object
- [ ] \`BRACKETS\` object — all 4 filing statuses
- [ ] Meta title year (layout.tsx)

---

